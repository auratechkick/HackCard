<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="HackCard security lab platform">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="80" y="60" width="1040" height="300" rx="24" fill="#0b1220" stroke="#334155" stroke-width="2"/>
  <text x="600" y="150" fill="#f8fafc" font-family="Segoe UI, system-ui, sans-serif" font-size="56" font-weight="700" text-anchor="middle">HackCard</text>
  <text x="600" y="200" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="22" text-anchor="middle">NFC · Wi-Fi lab · BLE · USB HID · Lab Console</text>
  <rect x="200" y="240" width="320" height="88" rx="12" fill="#1e293b" stroke="#475569"/>
  <text x="360" y="278" fill="#22d3ee" font-family="Segoe UI, sans-serif" font-size="18" font-weight="600" text-anchor="middle">ESP32-S3</text>
  <text x="360" y="308" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="14" text-anchor="middle">Lab Console @ 192.168.4.1</text>
  <rect x="680" y="240" width="320" height="88" rx="12" fill="#1e293b" stroke="#475569"/>
  <text x="840" y="278" fill="#a78bfa" font-family="Segoe UI, sans-serif" font-size="18" font-weight="600" text-anchor="middle">RP2350</text>
  <text x="840" y="308" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="14" text-anchor="middle">USB serial lab + NFC / HID</text>
  <rect x="520" y="252" width="160" height="64" rx="8" fill="url(#accent)" opacity="0.15"/>
