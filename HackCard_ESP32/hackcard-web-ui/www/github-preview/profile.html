<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=480">
  <title>HackCard — Business profile (preview)</title>
  <link rel="stylesheet" href="../assets/css/profile.css">
</head>
<body>
  <div class="page-bg"></div>
  <div class="resume">
    <p class="brand-bar" aria-hidden="true"><span class="hack">Hack</span><span class="card">Card</span></p>
    <header class="resume-hero">
      <div class="hero-main">
        <div class="avatar" aria-hidden="true">AK</div>
        <div class="hero-text">
          <p class="eyebrow">Digital Profile</p>
          <h1>Alex Kim</h1>
          <p class="headline">Security researcher · Lab instructor</p>
          <p class="company-line">HackCard Lab</p>
        </div>
      </div>
      <div class="hero-qr">
        <div class="qr-box" style="display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);border:1px dashed var(--border);">QR</div>
        <p class="qr-caption">Scan to save contact</p>
      </div>
    </header>
    <div class="resume-grid">
      <section class="resume-section">
        <h2>Contact</h2>
        <ul class="info-list">
          <li><span>Email</span> lab@example.com</li>
          <li><span>Web</span> example.com</li>
        </ul>
      </section>
    </div>
    <div class="cta-row">
      <a class="btn-cta primary" href="#">Save Contact (vCard)</a>
    </div>
  </div>
</body>
</html>
