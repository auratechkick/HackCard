<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280">
  <title>HackCard Lab Console — USB HID (preview)</title>
  <link rel="stylesheet" href="../assets/css/dashboard.css">
  <style>body { min-width: 1280px; } .page { display: block !important; }</style>
</head>
<body>
<div class="app">
  <aside class="sidebar desktop-only">
    <div class="brand"><h1>Hack<span>Card</span></h1><p>Lab Console</p></div>
    <nav class="nav">
      <button class="nav-link active" type="button"><span class="icon">?</span> USB HID</button>
    </nav>
    <div class="sidebar-foot">
      <div class="sidebar-conn"><span class="status-dot status-dot-sidebar online"></span><span class="sidebar-conn-label">Online</span></div>
    </div>
  </aside>
  <div class="workspace"><main class="main">
    <section class="page active">
      <div class="page-header"><h2>USB HID Lab</h2><p>Keystrokes go to USB host PC — connect USB-C to target</p></div>
      <div class="card" style="margin-bottom:16px"><p>HID ready · TinyUSB keyboard + mouse + media</p></div>
      <div class="grid grid-2">
        <div class="card">
          <h3>Target OS</h3>
          <select><option>Windows</option></select>
          <h3 style="margin-top:16px">Apps</h3>
          <div class="btn-row hid-quick-actions">
            <button class="btn btn-sm btn-ghost" type="button">Notepad</button>
            <button class="btn btn-sm btn-ghost" type="button">Calculator</button>
            <button class="btn btn-sm btn-ghost" type="button">Lock</button>
            <button class="btn btn-sm btn-ghost" type="button">Screenshot</button>
          </div>
        </div>
        <div class="card">
          <h3>Custom</h3>
          <label>Type text</label><input value="Hello from HackCard">
          <button class="btn btn-primary btn-sm" type="button">Type Text</button>
          <label>Open URL</label><input value="https://www.google.com">
        </div>
      </div>
    </section>
  </main></div>
</div>
</body>
</html>
