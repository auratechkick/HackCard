name: Build ESP32 user guide

on:
  push:
    branches: [main]
    paths:
      - 'HackCard_ESP32/user-guide/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MkDocs
        run: pip install mkdocs-material

      - name: Build static site
        working-directory: HackCard_ESP32/user-guide
        run: mkdocs build -d ../../docs/esp32

      - name: Commit docs/esp32
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/esp32
          git diff --staged --quiet || git commit -m "Rebuild ESP32 user guide (MkDocs)"
          git push
