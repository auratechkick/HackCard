name: Build user guides (ESP32 + RP2350)

on:
  push:
    branches: [main]
    paths:
      - 'HackCard_ESP32/user-guide/**'
      - 'HackCard_RP2350/user-guide/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MkDocs
        run: pip install mkdocs-material

      - name: Build ESP32 guide
        working-directory: HackCard_ESP32/user-guide
        run: mkdocs build -d ../../docs/esp32

      - name: Build RP2350 guide
        working-directory: HackCard_RP2350/user-guide
        run: mkdocs build -d ../../docs/rp2350

      - name: Commit docs/esp32 and docs/rp2350
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/esp32 docs/rp2350
          git diff --staged --quiet || git commit -m "Rebuild MkDocs user guides (ESP32 + RP2350)"
          git push
